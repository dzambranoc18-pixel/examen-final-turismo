<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto y Reservas | Tonsupa Paraiso Tropical</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo-container">
        <h1>Tonsupa Paraiso Tropical</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="destinos.html">Lugares</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Formulario de Reserva / Cotización</h2>
    <div class="form-container">
      <form action="#" method="post">
        <div class="form-grid">
          <div class="form-group">
            <label for="nombre">Nombre Completo *</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Maria Lopez">
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono / WhatsApp *</label>
            <input type="tel" id="telefono" name="telefono" required placeholder="0994628770">
          </div>

          <div class="form-group">
            <label for="destino">Destino o Actividad *</label>
            <select id="destino" name="destino" required>
              <option value="">-- Seleccione una opción --</option>
              <option value="playa">Playa Principal y Relax</option>
              <option value="deportes">Deportes Acuáticos</option>
              <option value="gastronomia">Ruta Gastronómica</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fecha">Fecha Estimada *</label>
            <input type="date" id="fecha" name="fecha" required>
          </div>

          <div class="form-group">
            <label for="personas">Número de Personas *</label>
            <input type="number" id="personas" name="personas" min="1" max="50" required placeholder="1">
          </div>
        </div>

        <div class="form-group">
          <label for="servicio">Tipo de Servicio *</label>
          <select id="servicio" name="servicio" required>
            <option value="full-day">Full Day Aventura</option>
            <option value="gastronomico">Tour Gastronómico</option>
            <option value="fin-de-semana">Paquete Fin de Semana</option>
            <option value="personalizado">Servicio Personalizado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje / Requerimientos Especiales</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escriba aquí sus dudas o sugerencias..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar Solicitud</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tonsupa Paraiso Tropical - Agencia de Turismo.</p>
    <p>Desarrollado por: Danny Aracely Zambrano Carvajal</p>
  </footer>
</body>
</html>
